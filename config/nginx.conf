upstream puma_my_course {
    server unix:///srv/www/apps/my-course/shared/tmp/sockets/my-course-puma.sock fail_timeout=0;
}

server {
    listen 80;
    server_name 10.0.2.15;
    root /srv/www/apps/my-course/current/public;

    access_log /var/log/nginx/my-course.access.log;
    error_log /var/log/nginx/my-course.error.log;

    location / {
        try_files $uri @puma;
    }

    location @puma {
        proxy_pass http://puma_my_course;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location ~ ^/(assets|packs|uploads|system|storage)/ {
        expires max;
        add_header Cache-Control public;
        try_files $uri @puma;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|eot|woff|woff2|ttf)$ {
        expires max;
        add_header Cache-Control public;
        try_files $uri @puma;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml text/plain text/html;
}
